name: Production Health Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production integrations
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --max-time 25 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://rivasyoutubelivehandoff.vercel.app/api/cron/health
